<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Admin - Indicação Premiada Prompt</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Admin</h1>
                <p>Indicação Premiada Prompt</p>
            </div>
            <form id="loginForm">
                <div class="input-box">
                    <span class="input-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="loginUser" placeholder="Usuário" required />
                </div>
                <div class="input-box">
                    <span class="input-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="loginPassword" placeholder="Senha" required />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div id="loginFeedback" class="alert" style="display: none;"></div>
                <button type="submit" class="login-btn">
                    <span>Entrar</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
                <button type="button" id="backToIndex" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    Voltar
                </button>
            </form>
        </div>
    </div>

    <!-- Painel Admin -->
    <div id="adminContainer" class="admin-container hidden">
        <header class="admin-header">
            <div class="header-inner">
                <div class="logo-area">
                    <span class="logo-text">Admin <span class="highlight">Painel</span></span>
                </div>
                <div class="header-controls">
                    <button id="themeToggle" class="header-btn theme-btn" aria-label="Alternar tema">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button id="logoutBtn" class="header-btn logout-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="vagas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                    Vagas
                </button>
                <button class="tab-btn" data-tab="indicacoes">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Indicações
                </button>
            </div>

            <!-- Conteúdo Vagas -->
            <div id="vagasTab" class="tab-content active">
                <div class="tab-header">
                    <h2>Gerenciar Vagas</h2>
                    <button id="novaVagaBtn" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Nova Vaga
                    </button>
                </div>
                <div id="vagasList" class="admin-list"></div>
            </div>

            <!-- Conteúdo Indicações -->
            <div id="indicacoesTab" class="tab-content">
                <div class="tab-header">
                    <h2>Lista de Indicações</h2>
                    <span id="totalIndicacoes" class="total-badge">0</span>
                </div>
                <div id="indicacoesList" class="admin-list"></div>
            </div>
        </main>
    </div>

    <!-- Modal Nova/Editar Vaga -->
    <div id="vagaModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="closeVagaModal">×</span>
            <h2 id="vagaModalTitle">Nova Vaga</h2>
            <form id="vagaForm">
                <div class="input-box">
                    <span class="input-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </span>
                    <input type="text" id="vagaTitulo" placeholder="Título da vaga" required />
                </div>
                <div class="input-box">
                    <span class="input-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </span>
                    <input type="text" id="vagaLocal" placeholder="Local (ex: Bairro / Cidade)" required />
                </div>
                <div class="input-box">
                    <span class="input-icon-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M12 2v4M12 22v-4M4 12H2M22 12h-2M19.07 4.93l-2.83 2.83M6.34 17.66l-2.83 2.83M17.66 6.34l2.83-2.83M4.93 19.07l2.83-2.83"/>
                            <circle cx="12" cy="12" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="vagaSalario" placeholder="Salário (ex: R$ 7.000,00)" required />
                </div>
                <div class="input-box textarea-box">
                    <span class="input-icon-left textarea-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <textarea id="vagaDescricao" placeholder="Descrição da vaga (responsabilidades, requisitos...)" rows="4" required></textarea>
                </div>
                <input type="hidden" id="vagaEditId" value="" />
                <div id="vagaFormFeedback" class="alert" style="display: none;"></div>
                <button type="submit" class="login-btn">
                    <span id="vagaSubmitText">Criar Vaga</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Confirmar Exclusão -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content confirm-modal">
            <span class="close" id="closeConfirmModal">×</span>
            <h2>Confirmar Exclusão</h2>
            <p>Tem certeza que deseja excluir esta vaga?</p>
            <p id="confirmVagaNome" style="font-weight: 600; color: var(--link-color); margin: 10px 0;"></p>
            <div class="confirm-buttons">
                <button id="confirmDeleteBtn" class="delete-btn">Excluir</button>
                <button id="cancelDeleteBtn" class="cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader-spinner"></div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
